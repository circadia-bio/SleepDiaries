name: Open release PR

# Opens (or updates) a pull request into `release` from a pinned snapshot of a
# version tag, NOT from the moving tip of `main`. Anything merged to `main`
# after the tag was cut cannot leak into the release.
#
# Usage:
#   1. On main, after the version bump:  git tag v1.2.0 && git push origin v1.2.0
#   2. Actions → Open release PR → Run workflow → tag: v1.2.0
#   3. Merge the PR into `release` to go to production.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v1.2.0). Must be on main."
        required: true
      notes:
        description: "Optional extra notes to include in the PR body"
        required: false
        default: ""

permissions:
  contents: write        # push the release-candidate branch
  pull-requests: write   # open / update the PR

jobs:
  release-pr:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      NOTES: ${{ inputs.notes }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Validate tag
        id: version
        run: |
          # Tag must be reachable from main (no releasing stray branches)
          git fetch origin main release
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $TAG is not on main."
            exit 1
          fi

          # package.json at the tag must match the tag name
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag is $TAG but package.json at that commit says v$VERSION. Did you tag before bumping?"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check for changes to release
        id: diff
        run: |
          AHEAD=$(git rev-list --count origin/release..HEAD)
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          echo "$TAG is $AHEAD commit(s) ahead of release"

      - name: Pin release candidate branch
        if: steps.diff.outputs.ahead != '0'
        run: |
          git push --force origin "HEAD:refs/heads/release-candidate/$TAG"

      - name: Open or update PR
        if: steps.diff.outputs.ahead != '0'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TITLE="🚀 release: v${VERSION}"
          SHA=$(git rev-parse --short HEAD)
          {
            echo "Promotes \`$TAG\` (\`$SHA\`) to production (\`release\`)."
            echo
            echo "This PR is pinned to the tag, so later commits on \`main\` are **not** included."
            echo
            echo "### Before merging"
            echo "- [ ] Tests passing on the tagged commit"
            echo "- [ ] Checked the \`main\` branch deploy preview on Netlify"
            echo "- [ ] \`CHANGELOG.md\` entry matches the release"
            if [ -n "$NOTES" ]; then
              echo
              echo "### Notes"
              echo "$NOTES"
            fi
          } > body.md

          HEAD_BRANCH="release-candidate/$TAG"
          EXISTING=$(gh pr list --base release --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file body.md
            echo "Updated PR #$EXISTING"
          else
            gh pr create --base release --head "$HEAD_BRANCH" --title "$TITLE" --body-file body.md
          fi

      - name: Nothing to release
        if: steps.diff.outputs.ahead == '0'
        run: echo "release already contains $TAG. No PR opened."
